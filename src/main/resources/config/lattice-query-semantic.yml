# 通用查询语义信号配置
# 规则：仅允许通用语言结构信号，禁止绑定具体业务域、文档标题、术语或样例问题
lattice:
  query:
    semantic:
      # 计数信号：中文通用量词，表达“有多少”意图
      count-signals:
        - "多少条"
        - "多少个"
        - "数量"
        - "计数"
        - "几条"
        - "几行"
        - "几条数据"
        - "多少行"
        - "行数"
      # 对比信号：中文通用比较语义
      comparison-signals:
        - "比较"
        - "对比"
        - "区别"
        - "差异"
        - "有何不同"
        - "有什么不同"
      # 深度研究触发信号：中文通用排查/调用链/影响类语义
      deep-research-signals:
        - "排查"
        - "调用链"
        - "影响"
        - "为什么"
      # 架构信号：涉及架构设计、组件职责、调用链、同步/异步、消息队列、服务边界、设计取舍
      architecture-signals:
        - "架构"
        - "消息队列"
        - "解耦"
        - "同步调用"
        - "异步通信"
        - "组件职责"
        - "服务边界"
        - "系统设计"
        - "技术选型"
        - "交互方式"
        - "为什么不直接"
      # 精确配置标识信号：中文通用路径/接口/配置类结构信号
      config-identifier-signals:
        - "接口路径"
        - "配置项"
        - "取值为"
        - "在哪里配置"
        - "配置文件"
        - "路径是什么"
        - "什么路径"
        - "配置在哪里"
      # 能力/接入信号：表达支持哪些方式、入口、接入能力类语义
      capability-signals:
        - "接入方式"
        - "哪些入口"
        - "开发接入"
        - "支持哪些"
        - "集成方式"
        - "接入能力"
        - "入口方式"
      # 流程/流转信号：表达主链路、流转、运行流程类 flow 语义
      flow-signals:
        - "运行流程"
        - "流程是什么"
        - "流程"
        - "链路"
        - "流转"
        - "怎么走"
      # 多焦点分隔信号：中文通用并列连词，表达同一问题内多个取值焦点
      multi-focus-signals:
        - "和"
      # 文档附录/结构标记信号：通用文档结构标识，用于非事实行识别
      boilerplate-section-signals:
        - "附录"
      # 答案形态-顺序信号：表达流程/步骤/阶段/顺序类语义
      sequence-signals:
        - "步骤"
        - "流程"
        - "顺序"
        - "先后"
        - "阶段"
        - "第一步"
        - "第二步"
        - "第三步"
        - "执行顺序"
        - "怎么走"
        - "如何推进"
        - "sequence"
        - "step"
        - "steps"
        - "process"
        - "workflow"
        - "timeline"
      # 答案形态-枚举信号：表达列出/清单/包含类语义
      enum-signals:
        - "有哪些"
        - "哪些"
        - "清单"
        - "列表"
        - "包括什么"
        - "包含什么"
        - "列出"
        - "枚举"
        - "包括哪些"
        - "包含哪些"
        - "list"
        - "items"
        - "options"
        - "types"
        - "categories"
      # 答案形态-状态信号：表达状态/结论/进展/是否类语义
      status-signals:
        - "状态"
        - "现状"
        - "是否启用"
        - "是否生效"
        - "是否完成"
        - "结论"
        - "结果"
        - "进展"
        - "被调整"
        - "调整"
        - "修正"
        - "降级"
        - "status"
        - "state"
        - "current"
        - "enabled"
        - "disabled"
        - "done"
        - "pending"
      # 答案形态-规则信号：表达规则/约束/必须/禁止/边界类语义
      policy-signals:
        - "规则"
        - "原则"
        - "约束"
        - "要求"
        - "必须"
        - "禁止"
        - "不得"
        - "不允许"
        - "适用范围"
        - "边界"
        - "必须遵守"
        - "policy"
        - "rule"
        - "constraint"
        - "requirement"
        - "must"
        - "forbid"
        - "forbidden"
        - "allowed"
