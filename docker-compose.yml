services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lattice-java:local
    container_name: lattice_app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local-dev
      SERVER_PORT: 18082
      SPRING_DATASOURCE_URL: jdbc:postgresql://vector_db:5432/ai-rag-knowledge?currentSchema=lattice
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      LATTICE_REDIS_HOST: redis
      LATTICE_REDIS_PORT: 6379
      LATTICE_SOURCE_ADMIN_STAGING_ROOT_DIR: /data/lattice-source-sync
      LATTICE_SOURCE_ADMIN_MIRROR_ROOTS_DEFAULT: /mirror-roots
      LATTICE_LLM_DEEP_RESEARCH_STARTUP_VALIDATION_ENABLED: "false"
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-any-non-empty-value}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.openai.com}
      SPRING_AI_ANTHROPIC_API_KEY: ${SPRING_AI_ANTHROPIC_API_KEY:-any-non-empty-value}
      SPRING_AI_ANTHROPIC_BASE_URL: ${SPRING_AI_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    ports:
      - "${LATTICE_APP_HOST_PORT:-18082}:18082"
    volumes:
      - lattice_app_data:/data
      - ${LATTICE_MIRROR_ROOT_HOST_DIR:-./docker/mirror-roots}:/mirror-roots:ro
    networks:
      - binghe-network

volumes:
  lattice_app_data:

networks:
  binghe-network:
    external: true
